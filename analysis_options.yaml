include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
  language:
    # Catch unsafe implicit casts from dynamic (JSON) at compile time.
    strict-casts: true

linter:
  rules:
    # Bug classes the code review checks, kept on so CI catches them.
    - use_build_context_synchronously
    - cancel_subscriptions
    - close_sinks
    - avoid_catching_errors
    - only_throw_errors
