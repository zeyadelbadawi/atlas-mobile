name: CI

on:
  pull_request:
  push:
    branches: [main, 'claude/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  checks:
    name: Analyze, test, Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      # Integration tests skip themselves without a local backend.
      - run: flutter test
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 14

  ios:
    name: iOS build (no signing)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Firebase iOS SDK 13 (firebase_messaging 17) needs Swift tools 6.2,
      # i.e. Xcode 26 — also the Xcode the App Store requires. The macOS 15
      # image ships it beside its default 16.x; pick the newest.
      - name: Use Xcode 26
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$x" ]; then echo "::error::No Xcode 26 on this runner image"; exit 1; fi
          sudo xcode-select -s "$x"
      - run: xcodebuild -version
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
