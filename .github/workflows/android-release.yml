# Builds a signed Android App Bundle (.aab) for Google Play. Manual only.
# Needs these repo secrets (see tool/make_upload_key.sh):
#   ATLAS_UPLOAD_KEYSTORE_BASE64  base64 of the upload .jks
#   ATLAS_UPLOAD_STORE_PASSWORD   keystore password
#   ATLAS_UPLOAD_KEY_PASSWORD     key password
#   ATLAS_UPLOAD_KEY_ALIAS        key alias (e.g. atlas-upload)
# Without the secrets the job stops early (the normal CI APK build, which
# falls back to the debug key, is unaffected).
name: Android release (signed AAB)

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  aab:
    name: Signed App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check signing secret is set
        env:
          KS: ${{ secrets.ATLAS_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::ATLAS_UPLOAD_KEYSTORE_BASE64 is not set — add the upload-key secrets first."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Decode upload keystore
        run: echo "${{ secrets.ATLAS_UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - run: flutter pub get
      - name: Build signed AAB
        env:
          ATLAS_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          ATLAS_UPLOAD_STORE_PASSWORD: ${{ secrets.ATLAS_UPLOAD_STORE_PASSWORD }}
          ATLAS_UPLOAD_KEY_PASSWORD: ${{ secrets.ATLAS_UPLOAD_KEY_PASSWORD }}
          ATLAS_UPLOAD_KEY_ALIAS: ${{ secrets.ATLAS_UPLOAD_KEY_ALIAS }}
        run: flutter build appbundle --release
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-play-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
